<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bee Tagger</title>
<style>
:root{--bg:#0f1115;--panel:#171a21;--panel2:#1e222b;--line:#2a2f3a;--text:#e7e9ee;--dim:#8b91a0;--accent:#6c8cff;--radius:10px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,select,input{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:rgba(15,17,21,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px;padding:9px 16px;flex-wrap:wrap}
.row+.row{border-top:1px solid var(--line)}
.title{font-weight:700;letter-spacing:.2px}
.title span{color:var(--accent)}
select{max-width:170px}
select,.btn,input[type=search],input[type=text],input[type=number]{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.btn,select{cursor:pointer}
.btn:hover,select:hover{border-color:#3b4252}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#0b0d14;font-weight:600}
.btn.ghost{background:transparent}
.btn.sm{padding:3px 8px;font-size:12px}
.spacer{flex:1}.dim{color:var(--dim)}
.progress{width:140px;height:6px;border-radius:3px;background:var(--panel2);overflow:hidden}
.progress>div{height:100%;background:var(--accent);width:0;transition:width .2s}
/* tabs */
.tabs{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.tab{border:0;background:transparent;padding:6px 12px;border-radius:7px;cursor:pointer;color:var(--dim);font-weight:600}
.tab:hover{color:var(--text)}
.tab.on{background:var(--accent);color:#0b0d14}
/* palette */
#palette{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tagbtn{display:inline-flex;align-items:center;gap:8px;padding:7px 12px 7px 9px;border-radius:999px;border:1px solid var(--line);
  background:var(--panel2);cursor:pointer;user-select:none;transition:transform .05s,border-color .1s}
.tagbtn:hover{border-color:var(--c)}.tagbtn:active{transform:scale(.96)}
.tagbtn .dot{width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.tagbtn kbd,.kbd{font:11px ui-monospace,monospace;color:var(--dim);background:var(--bg);border-radius:4px;padding:0 5px}
.tagbtn.add,.tagbtn.clear{background:transparent;border-style:dashed;color:var(--dim)}
.sep{width:1px;align-self:stretch;background:var(--line);margin:0 4px}
.numctl{display:inline-flex;align-items:center;gap:6px}
.numctl input{width:96px;text-align:center;font-weight:700}
.hint{font-size:12px;color:var(--dim)}
.chip{padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:13px;color:var(--dim)}
.chip.on{background:var(--panel2);color:var(--text);border-color:var(--accent)}
.chip .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--c)}
main{padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--size,170px),1fr));gap:12px}
.card{position:relative;background:var(--panel);border:2px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;content-visibility:auto;contain-intrinsic-size:auto 230px}
.card:hover{border-color:#3b4252}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 2px rgba(108,140,255,.35)}
.card .im{aspect-ratio:1;background:#0a0b0e;display:block;width:100%;object-fit:contain}
.card .meta{display:flex;justify-content:space-between;align-items:center;padding:6px 9px;font-size:12px;color:var(--dim);gap:6px}
.card .meta>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .bar{height:5px;background:var(--c,transparent)}
.card .predline{padding:4px 9px;font-size:12px;background:var(--panel2);border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card .predline.bad{background:rgba(229,72,77,.14)}.card .predline.ok{background:rgba(48,164,108,.14)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:1px 8px 1px 5px;border-radius:999px;background:var(--bg);color:var(--text);font-size:12px;white-space:nowrap}
.pill i{width:9px;height:9px;border-radius:50%;background:var(--c);display:inline-block}
.num{display:inline-block;min-width:28px;text-align:center;padding:0 6px;border-radius:6px;background:var(--text);color:#111;font-weight:800;font-size:12px}
.num.empty{background:transparent;color:var(--dim);border:1px dashed var(--line);font-weight:400}
.card .idx{position:absolute;top:8px;right:6px;background:rgba(0,0,0,.6);border-radius:6px;padding:0 6px;font-size:11px}
.card .nb{position:absolute;top:10px;left:6px;font-size:15px;padding:1px 8px}
.card.override{border-style:dashed;border-color:var(--c)}
.badge{position:absolute;bottom:64px;left:6px;padding:1px 7px;border-radius:999px;background:var(--accent);color:#0b0d14;font-size:11px;font-weight:700}
.empty{padding:60px;text-align:center;color:var(--dim);grid-column:1/-1}
.menu{position:fixed;z-index:100;min-width:210px;max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 12px 40px rgba(0,0,0,.55)}
.menu .h{padding:6px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim)}
.menu .it{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;cursor:pointer}
.menu .it:hover{background:var(--panel2)}
.menu .it .dot{width:12px;height:12px;border-radius:50%;background:var(--c)}
.menu .it.danger{color:#ff7b80}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 0}
.menu label{display:flex;align-items:center;gap:8px;padding:6px 10px}
.menu input[type=text],.menu input[type=number]{flex:1;min-width:0;width:100%}
.menu input[type=color]{width:34px;height:28px;border:0;background:none;padding:0;cursor:pointer}
.ngrid{display:grid;grid-template-columns:repeat(10,34px);gap:3px;padding:4px}
.ngrid button{height:30px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);cursor:pointer;font-size:12px}
.ngrid button:hover{background:var(--accent);color:#0b0d14}.ngrid button.cur{border-color:var(--accent);font-weight:800}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:8px 14px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:300}
#toast.on{opacity:1}
#numbuf{position:fixed;right:20px;bottom:20px;z-index:250;font-size:34px;font-weight:800;background:var(--text);color:#111;padding:4px 18px;border-radius:12px;display:none}
/* panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.panel h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--dim)}
.form input,.form select{width:100%;color:var(--text)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:150;display:flex;align-items:center;justify-content:center}
.modal>div{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(640px,94vw);max-height:84vh;display:flex;flex-direction:column;padding:16px;gap:10px}
.files{overflow:auto;border:1px solid var(--line);border-radius:8px;flex:1;min-height:180px}
.files div{padding:6px 10px;cursor:pointer;display:flex;gap:8px}.files div:hover{background:var(--panel2)}
/* distribution */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile b{display:block;font-size:26px;letter-spacing:-.5px}.tile span{color:var(--dim);font-size:12px}
.tile.hi{border-color:var(--accent)}
.charts{display:grid;grid-template-columns:minmax(280px,1fr) 2fr;gap:14px}
@media(max-width:900px){.charts{grid-template-columns:1fr}}
.brow{display:grid;grid-template-columns:96px 1fr 64px;align-items:center;gap:8px;padding:4px 6px;border-radius:8px;cursor:pointer}
.brow:hover{background:var(--panel2)}.brow.on{background:var(--panel2);outline:1px solid var(--accent)}
.brow .track{height:16px;background:var(--bg);border-radius:8px;overflow:hidden}
.brow .fill{height:100%;background:var(--c);border-radius:8px}
.brow .v{text-align:right;font-variant-numeric:tabular-nums}
.filt{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.filt input[type=number]{width:70px}
svg text{fill:var(--dim);font-size:10px}
.mrow{display:grid;grid-template-columns:200px 1fr 260px;gap:10px;align-items:center;padding:6px 0}
.mrow input[type=text]{width:100%}
.bad{border-color:#e5484d !important}.okc{color:#30a46c}.warnc{color:#ff9b52}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.res .tile b{font-size:22px}
.rotwrap{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;justify-content:center}
.stage{position:relative;width:min(74vh,720px,92vw);aspect-ratio:1;background:#07080a;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:transform .08s}
.stage .g{position:absolute;background:rgba(108,140,255,.55);pointer-events:none}
.stage .gh{left:0;right:0;top:50%;height:1px}.stage .gv{top:0;bottom:0;left:50%;width:1px}
.side{display:flex;flex-direction:column;gap:8px;width:250px}
.side .btn{padding:10px 12px;font-size:15px;text-align:left}
.side .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.side .two .btn{text-align:center}
.angle{font-size:44px;font-weight:800;text-align:center;letter-spacing:-1px}
.side input[type=number]{width:80px}
svg .bar{cursor:pointer}
</style>
</head>
<body>
<header>
  <div class="row">
    <div class="title">Bee<span>Tagger</span></div>
    <div class="tabs" id="tabs">
      <button class="tab on" data-t="tag">Tag</button>
      <button class="tab" data-t="inference">Inference</button>
      <button class="tab" data-t="dist">Distribution</button>
      <button class="tab" data-t="merge">Merge</button>
      <button class="tab" data-t="rot">Rotation</button>
    </div>
    <select id="dsSel" title="Dataset"></select>
    <button class="btn" id="openBtn">Open CSV…</button>
    <button class="btn ghost sm" id="forgetBtn" title="Remove this dataset from the list (files are not deleted)">✕</button>
    <button class="btn ghost" id="backBtn" style="display:none">← Back to tracks</button>
    <span id="crumb" class="dim"></span>
    <div class="spacer"></div>
    <span id="stats" class="dim" style="font-size:12px"></span>
    <div class="progress"><div id="prog"></div></div>
    <button class="btn" id="undoBtn" title="Ctrl+Z">Undo</button>
    <button class="btn primary" id="exportBtn" title="Export a CSV copy with tag columns (to a server directory or your computer)">Export CSV</button>
  </div>
  <div class="row" id="palRow"><div id="palette"></div></div>
  <div class="row" id="tagFilterRow">
    <div id="chips" style="display:flex;gap:6px;flex-wrap:wrap"></div>
    <select id="fnMode" title="Number filter"><option value="any">Number: any</option><option value="has">Has number</option><option value="none">No number</option><option value="eq">Number =</option></select>
    <input type="number" id="fnVal" min="1" max="100" style="width:70px;display:none">
    <div class="spacer"></div>
    <input type="search" id="search" placeholder="Search track…" style="width:160px">
    <label class="dim">after tagging <select id="adv"><option value="both">next when color+number set</option><option value="any">next after any tag</option><option value="off">stay</option></select></label>
    <label class="dim">thumbnail <select id="thumbMode" title="Which image represents a track in the gallery (Shift+scroll over a card to flip through its images)"><option value="mid">middle image</option><option value="first">first image</option></select></label>
    <label class="dim">size <input type="range" id="size" min="100" max="380" value="170"></label>
  </div>
  <div class="row" id="infFilterRow" style="display:none">
    <div id="infChips" style="display:flex;gap:6px;flex-wrap:wrap"></div>
    <label class="dim">confidence ≤ <input type="range" id="thr" min="1" max="100" value="100"> <span id="thrV">100%</span></label>
    <label class="dim">sort <select id="infSort"><option value="conf">lowest confidence first</option><option value="confd">highest confidence first</option><option value="order">track order</option></select></label>
    <div class="spacer"></div>
    <button class="btn" id="acceptSel" title="A">Accept prediction for selected <span class="kbd">A</span></button>
    <button class="btn" id="acceptVis">Accept all visible…</button>
    <label class="dim">thumbnail <select id="thumbMode2" title="Which image represents a track in the gallery (Shift+scroll over a card to flip through its images)"><option value="mid">middle image</option><option value="first">first image</option></select></label>
    <label class="dim">size <input type="range" id="size2" min="100" max="380" value="170"></label>
  </div>
</header>
<main>
  <div id="infPanel" class="panel" style="display:none"></div>
  <div id="content" class="grid"></div>
  <div id="dist" style="display:none"></div>
  <div id="merge" style="display:none"></div>
  <div id="rot" style="display:none"></div>
</main>
<div id="toast"></div><div id="numbuf"></div>

<script>
const $ = s => document.querySelector(s);
const S = { ds:null, tracks:[], tags:[], labels:{tracks:{},images:{}}, preds:{}, tp:{}, imgTrack:{},
  tab:'tag', view:'gallery', open:null, sel:new Set(), anchor:null, fc:'all', fn:{mode:'any',val:null}, q:'',
  undo:[], visible:[], inf:{filter:'review', thr:100, sort:'conf', job:null},
  dist:{unit:'images', colors:new Set(), nlo:null, nhi:null},
  thumb:{mode:localStorage.getItem('thumbMode') || 'mid', at:{}} };   // gallery thumbnail: default image per track + per-track scrub position
const NUMMAX = 100;
const KEYS = ['q','w','e','r','t','y','u','i','o','p'];
// hotkey per tag: explicit t.key ('' = none) wins; otherwise the default for its position, unless another tag took that key
function tagKeys(){
  const m = {}, used = new Set(S.tags.map(t => t.key).filter(Boolean));
  S.tags.forEach((t, i) => { m[t.id] = t.key !== undefined ? t.key : (i < KEYS.length && !used.has(KEYS[i]) ? KEYS[i] : ''); });
  return m;
}
const imgUrl = f => `/api/img?name=${encodeURIComponent(S.ds)}&f=${encodeURIComponent(f)}`;
const tagById = id => S.tags.find(t => t.id === id);
async function api(p, body){
  const r = await fetch(p, body ? {method:'POST', body:JSON.stringify(body)} : {});
  const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status); return j;
}
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove('on'),2200); }
const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct = x => Math.round(x*100) + '%';

/* ---------- boot / datasets ---------- */
async function boot(){
  S.tags = await api('/api/tags');
  await refreshDatasets();
}
async function refreshDatasets(select){
  const list = await api('/api/datasets');
  $('#dsSel').innerHTML = list.map(d => `<option value="${esc(d.name)}" title="${esc(d.csv)}">${esc(d.name)}</option>`).join('') || '<option value="">(no dataset)</option>';
  const want = select || localStorage.getItem('ds');
  if (want && list.some(d => d.name === want)) $('#dsSel').value = want;
  if (list.length) await loadDataset($('#dsSel').value);
  else { S.ds = null; S.tracks = []; render(); }
}
async function loadDataset(name){
  S.ds = name; localStorage.setItem('ds', name);
  $('#content').innerHTML = '<div class="empty">Loading…</div>';
  try {
    const d = await api('/api/dataset?name=' + encodeURIComponent(name));
    S.tracks = d.tracks; S.labels = d.labels; S.undo = []; R.built = false;
    S.imgTrack = {}; for (const t of S.tracks) for (const im of t.images) S.imgTrack[im.f] = t.key;
    S.preds = await api('/api/preds?name=' + encodeURIComponent(name)); computeTP();
    S.sel.clear(); S.view = 'gallery'; S.open = null; S.anchor = null; S.thumb.at = {};
    if (d.probe[1] && !d.probe[0]) toast("Couldn't find images at the CSV's crop_filepath (or ./crops/) — check the paths");
  } catch(e){ S.tracks = []; toast('Load failed: ' + e.message); }
  render();
}
async function openCsvPath(path){
  try { const r = await api('/api/open', {path}); closeModal(); await refreshDatasets(r.name); }
  catch(e){ toast(e.message); }
}
let modalEl, modalLock = false;   // modalLock: keep the popup open while a job is running
function closeModal(){ if (modalLock) return; modalEl?.remove(); modalEl = null; }
async function openModal(onPick){
  onPick = onPick || openCsvPath;
  closeModal();
  modalEl = document.createElement('div'); modalEl.className = 'modal';
  modalEl.innerHTML = `<div><b>Choose a CSV</b>
    <div style="display:flex;gap:8px"><input type="text" id="mpath" style="flex:1" placeholder="/path/to/tracks.csv  (needs a crop_filepath column)"><button class="btn primary" id="mgo">Select</button></div>
    <div class="dim" id="mdir"></div><div class="files" id="mfiles"></div><button class="btn" id="mclose">Cancel</button></div>`;
  document.body.appendChild(modalEl);
  modalEl.onmousedown = e => { if (e.target === modalEl) closeModal(); };
  $('#mclose').onclick = closeModal;
  $('#mgo').onclick = () => onPick($('#mpath').value.trim());
  $('#mpath').onkeydown = e => { if (e.key === 'Enter') $('#mgo').click(); };
  const browse = async p => {
    try {
      const r = await api('/api/browse?path=' + encodeURIComponent(p));
      $('#mdir').textContent = r.path;
      const rows = [`<div data-d="${esc(r.parent)}">📁 ..</div>`, ...r.dirs.map(d => `<div data-d="${esc(r.path + '/' + d)}">📁 ${esc(d)}</div>`),
                    ...r.files.map(f => `<div data-f="${esc(r.path + '/' + f)}">📄 ${esc(f)}</div>`)];
      $('#mfiles').innerHTML = rows.join('');
    } catch(e){ toast(e.message); }
  };
  $('#mfiles').onclick = e => { const d = e.target.closest('div[data-d],div[data-f]'); if (!d) return; d.dataset.d ? browse(d.dataset.d) : ($('#mpath').value = d.dataset.f); };
  $('#mfiles').ondblclick = e => { const d = e.target.closest('div[data-f]'); if (d) onPick(d.dataset.f); };
  browse(localStorage.getItem('browse') || '~');
  $('#mpath').focus();
}

/* ---------- labels ---------- */
const trackL = k => S.labels.tracks[k] || {};
const effC = (f,k) => S.labels.images[f]?.c ?? S.labels.tracks[k]?.c ?? null;
const effN = (f,k) => S.labels.images[f]?.n ?? S.labels.tracks[k]?.n ?? null;
function mergeLocal(ch){
  const inv = {tracks:{}, images:{}};
  for (const kind of ['tracks','images']) for (const [k,patch] of Object.entries(ch[kind]||{})) {
    const e = S.labels[kind][k] ||= {}, iv = inv[kind][k] = {};
    for (const [fld,v] of Object.entries(patch)) { iv[fld] = e[fld] ?? null; if (v === null) delete e[fld]; else e[fld] = v; }
    if (!Object.keys(e).length) delete S.labels[kind][k];
  }
  return inv;
}
function applyLabels(ch, record=true){
  const inv = mergeLocal(ch);
  if (record) S.undo.push(inv);
  api('/api/labels', {name:S.ds, ...ch}).catch(e => toast('Save failed: ' + e.message));
}
function undo(){
  const inv = S.undo.pop(); if (!inv) return toast('Nothing to undo');
  applyLabels(inv, false); render(); toast('Undone');
}
// apply a patch {c?:colorId|null, n?:number|null} to the selected tracks (or the open track)
function setPatch(patch, advance){
  if (S.view === 'gallery') {
    const keys = [...S.sel]; if (!keys.length) return toast('Select a track first');
    const ch = {tracks:{}, images:{}};
    for (const k of keys) ch.tracks[k] = {...patch};
    applyLabels(ch);
    if (keys.length === 1) {
      const k = keys[0], mode = $('#adv').value, tl = trackL(k);
      if (advance || mode === 'any' || (mode === 'both' && tl.c && tl.n)) {
        const vis = S.visible, i = vis.findIndex(t => t.key === k);
        if (i >= 0 && i < vis.length-1) { S.sel = new Set([vis[i+1].key]); S.anchor = vis[i+1].key; }
      }
    }
    render(); requestAnimationFrame(() => document.querySelector('.card.sel')?.scrollIntoView({block:'nearest'}));
  } else {
    const t = S.open, ch = {tracks:{[t.key]:{...patch}}, images:{}};
    for (const im of t.images) for (const fld of Object.keys(patch)) if (S.labels.images[im.f]?.[fld] !== undefined) (ch.images[im.f] ||= {})[fld] = null;
    applyLabels(ch); render(); toast('Whole track updated');
  }
}
const setField = (fld, value) => setPatch({[fld]:value}, false);
const setColor = id => setField('c', id);
function setNumber(n){
  if (n !== null) { n = parseInt(n); if (!(n >= 1 && n <= NUMMAX)) return toast(`Number must be 1–${NUMMAX}`); }
  setField('n', n);
}

/* ---------- predictions ---------- */
function computeTP(){   // aggregate per-image predictions to track level
  S.tp = {};
  for (const t of S.tracks) {
    const cv = {}, nv = {}; let cn = 0, nn = 0;
    for (const im of t.images) {
      const p = S.preds[im.f]; if (!p) continue;
      if (p[0]) { (cv[p[0]] ||= []).push(p[1]); cn++; }

const predConf = p => Math.min(...[p.hasC ? p.cc : 1, p.hasN ? p.nc : 1]);
function predStatus(k){   // 'none' | 'agree' | 'review'

/* ---------- filtering ---------- */
function visibleTracks(){
  const q = S.q.toLowerCase(), inf = S.tab === 'inference';
  let v = S.tracks.filter(t => {
    if (q && !t.key.toLowerCase().includes(q)) return false;
    const l = trackL(t.key);
    if (!inf) {
      if (S.fc === '__none' && l.c) return false;
      if (S.fc !== 'all' && S.fc !== '__none' && l.c !== S.fc) return false;
      const m = S.fn.mode;
      if (m === 'has' && !l.n) return false;
      if (m === 'none' && l.n) return false;
      if (m === 'eq' && S.fn.val !== null && l.n !== S.fn.val) return false;
      return true;
    }
    const st = predStatus(t.key), f = S.inf.filter;
    if (f === 'review' && st !== 'review') return false;
    if (f === 'agree' && st !== 'agree') return false;
    if (f === 'none' && st !== 'none') return false;
    if (f === 'all' && st === 'none') return false;
    if (st !== 'none' && predConf(S.tp[t.key]) > S.inf.thr/100 + 1e-9) return false;
    return true;

    const s = S.inf.sort === 'conf' ? 1 : -1;
    v = v.map(t => [t, S.tp[t.key] ? predConf(S.tp[t.key]) : 2]).sort((a,b) => s*(a[1]-b[1])).map(x => x[0]);

  return v;
}

let polling = false;
async function pollInfer(){

    let j; try { j = await api('/api/infer/status'); } catch(e){ break; }
    const running = j.state === 'running';
    if ($('#iRun')) {
      $('#iRun').disabled = running; $('#iStop').style.display = running ? '' : 'none';
      $('#iProg').parentElement.style.display = (running || j.state === 'done' || j.state === 'error') ? '' : 'none';
      $('#iProg').style.cssText = `height:100%;background:var(--accent);width:${j.total ? 100*j.done/j.total : 0}%`;
      $('#iMsg').textContent = j.state === 'error' ? '⚠ ' + j.msg : (running ? `${j.done} / ${j.total} images ${j.msg}` : (j.state === 'done' ? `done — ${j.total} images ${j.msg}` : ''));
      $('#iMsg').style.whiteSpace = 'pre-wrap';
    }
    if (prev === 'running' && !running && j.name === S.ds) { S.preds = await api('/api/preds?name=' + encodeURIComponent(S.ds)); computeTP(); render(); toast(j.state === 'done' ? 'Inference finished' : 'Inference failed'); }

/* ---------- distribution ---------- */
function records(){
  const L = S.labels, rec = [];
  if (S.dist.unit === 'tracks') { for (const t of S.tracks) { const l = L.tracks[t.key] || {}; rec.push({c:l.c ?? null, n:l.n ?? null, w:1}); } return rec; }
  const over = {};
  for (const [f,o] of Object.entries(L.images)) { const k = S.imgTrack[f]; if (k) (over[k] ||= []).push(o); }
  for (const t of S.tracks) {
    const l = L.tracks[t.key] || {}, os = over[t.key] || [];
    if (t.images.length - os.length > 0) rec.push({c:l.c ?? null, n:l.n ?? null, w:t.images.length - os.length});
    for (const o of os) rec.push({c:o.c ?? l.c ?? null, n:o.n ?? l.n ?? null, w:1});

}
function renderDist(){

  const nc = {}, nmax = {}; let nTot = 0;
  for (const r of rec) if (r.n !== null && inC(r)) { const m = nc[r.n] ||= {}; m[r.c ?? '__none'] = (m[r.c ?? '__none'] || 0) + r.w; nTot += r.w; }
  const colorRows = [...S.tags.map(t => ({id:t.id, name:t.name, color:t.color})), {id:'__none', name:'No color', color:'#3a3f4b'}];
  const cmax = Math.max(1, ...colorRows.map(r => cc[r.id] || 0));
  const colHtml = colorRows.map(r => `<div class="brow ${D.colors.has(r.id)?'on':''}" data-c="${r.id}" style="--c:${r.color}" title="Click to filter the number chart"><span>${esc(r.name)}</span><div class="track"><div class="fill" style="width:${100*(cc[r.id]||0)/cmax}%"></div></div><span class="v">${(cc[r.id]||0).toLocaleString()}</span></div>`).join('');
  // number histogram (stacked by color)
  const W = 900, H = 260, ml = 38, mb = 22, bw = (W-ml)/NUMMAX;
  const tot = n => Object.values(nc[n]||{}).reduce((a,b)=>a+b,0);
  let ymax = 1; for (let n = 1; n <= NUMMAX; n++) ymax = Math.max(ymax, tot(n));
  const nice = (() => { const p = Math.pow(10, Math.floor(Math.log10(ymax))); return [1,2,5,10].map(m=>m*p).find(v=>v>=ymax); })();
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Number distribution">`;
  for (let i = 0; i <= 4; i++) { const v = nice*i/4, y = H-mb-(H-mb-8)*i/4; svg += `<line x1="${ml}" x2="${W}" y1="${y}" y2="${y}" stroke="#2a2f3a"/><text x="${ml-6}" y="${y+3}" text-anchor="end">${Math.round(v).toLocaleString()}</text>`; }
  for (let n = 1; n <= NUMMAX; n++) {

      <span class="dim">Number range</span><input type="number" id="dlo" min="1" max="${NUMMAX}" placeholder="from" value="${D.nlo ?? ''}"> – <input type="number" id="dhi" min="1" max="${NUMMAX}" placeholder="to" value="${D.nhi ?? ''}">
      <button class="btn sm" id="dreset">Reset filters</button><span class="hint">Click a color row or a number bar to filter the other chart.</span></div>
    <div class="tiles">

}

  } else if (e.ctrlKey || e.metaKey) { S.sel.has(k) ? S.sel.delete(k) : S.sel.add(k); S.anchor = k; }
  else { S.sel = new Set([k]); S.anchor = k; }
  document.querySelectorAll('.card').forEach(el => el.classList.toggle('sel', S.sel.has(el.dataset.k)));
});

// keyboard entry: color letter (Q W E R T Y U I O P) and/or digits build a pending tag; nothing applies until Enter
let pend = {c:null, n:''};
function pendShow(){
  const el = $('#numbuf'), t = tagById(pend.c);
  el.style.display = (pend.c || pend.n) ? 'block' : 'none';
  el.innerHTML = (t ? `<span style="color:${t.color === '#f0f0f0' ? '#666' : t.color}">● ${esc(t.name)}</span> ` : '') + esc(pend.n) + ' <span style="font-size:14px;opacity:.6">⏎</span>';
}
function pendClear(){ pend = {c:null, n:''}; pendShow(); }
function pendCommit(){
  const patch = {};
  if (pend.c) patch.c = pend.c;
  if (pend.n) { const n = parseInt(pend.n); if (!(n >= 1 && n <= NUMMAX)) { pend.n = ''; pendShow(); return toast(`Number must be 1–${NUMMAX}`); } patch.n = n; }
  pendClear(); setPatch(patch, true);
}
document.addEventListener('keydown', e => {
  if (e.target.matches('input:not([type=range]),select,textarea')) return;
  if (S.tab === 'dist' || S.tab === 'merge' || !S.ds) return;
  if ((e.ctrlKey||e.metaKey) && e.key === 'z') { e.preventDefault(); return undo(); }
  if (S.tab === 'rot') return rotKey(e);
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const hk = !e.shiftKey && e.key.length === 1 ? S.tags.find(t => tagKeys()[t.id] === e.key.toLowerCase()) : null;
  if (hk) { e.preventDefault(); pend.c = hk.id; return pendShow(); }
  if (/^[0-9]$/.test(e.key)) { e.preventDefault(); if (pend.n.length < 3) pend.n += e.key; return pendShow(); }
  if (e.key === 'Enter' && (pend.c || pend.n)) { e.preventDefault(); return pendCommit(); }
  if (e.key === 'Backspace' && (pend.c || pend.n)) { e.preventDefault(); if (pend.n) pend.n = pend.n.slice(0,-1); else pend.c = null; return pendShow(); }
  if (e.key === 'Escape') { if (pend.c || pend.n) return pendClear(); if (document.querySelector('.menu')) return closeMenu(); if (modalEl) return closeModal(); if (S.view==='track') back(); else { S.sel.clear(); render(); } return; }
  if (e.key === 'Backspace' && S.view === 'track') return back();
  if (e.key === 'Delete') return setColor(null);
  if (S.view === 'gallery') {
    if (e.key.toLowerCase() === 'a' && S.tab === 'inference') return acceptKeys([...S.sel]);
    const cols = Math.max(1, getComputedStyle($('#content')).gridTemplateColumns.split(' ').length);
    const d = {ArrowRight:1, ArrowLeft:-1, ArrowDown:cols, ArrowUp:-cols}[e.key];
    if (d) { e.preventDefault(); moveSel(d); }
    else if (e.key === 'Enter' && S.anchor) openTrack(S.anchor);
  }
});

/* ---------- merge ---------- */

      <p class="hint" style="margin-top:0">Rows are matched by <code>crop_filepath</code>. Colors, numbers and rotations are copied into this program's own labels (exported as
      <code>tag_color</code>, <code>tag_number</code>, <code>tag_rotation</code>), whatever the source columns are called.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><input type="text" id="mSrc" style="flex:1;min-width:260px" placeholder="/path/to/other.csv">
        <button class="btn" id="mBrowse">Browse…</button><button class="btn primary" id="mScan">Scan</button></div>

async function mScan(){
  const path = $('#mSrc').value.trim(); if (!path) return;

  const row = (k, label) => `<div class="mrow"><label><input type="checkbox" id="mu_${k}" ${sc.guess[k] || k !== 'r' ? 'checked' : ''}> ${label}</label>

    <div class="mrow" style="grid-template-columns:1fr"><label><input type="checkbox" id="mAdd"> Also add rows that are <b>not</b> in the current CSV
      <span class="hint">(${sc.missing.toLocaleString()} rows — their track ids are renumbered to be unique per video, so they never collide with existing tracks)</span></label></div>
    <div class="mrow" style="grid-template-columns:1fr"><label><input type="checkbox" id="mOver"> Overwrite labels that are already set <span class="hint">(off = only fill blanks)</span></label></div>
    <div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap"><button class="btn" id="mPrev">Preview</button><button class="btn primary" id="mRun">Merge now</button><button class="btn ghost" id="mUndo">Undo last merge</button></div>`;
  for (const k of 'cnr') {

}
async function mRun(dry){
  const b = {name:S.ds, path:$('#mSrc').value.trim(), dry, add_missing:$('#mAdd').checked, overwrite:$('#mOver').checked};
  for (const k of 'cnr') { b['copy_'+k] = $('#mu_'+k).checked; b['col_'+k] = $('#mc_'+k).value.trim(); }

function renderMergeRes(){

}

/* ---------- rotation ---------- */
const R = {list:[], i:0, angle:0, step:15, todo:false, built:false};
function rotBuild(keepF){
  const list = [];
  for (const t of S.tracks) for (const im of t.images)
    if (effC(im.f, t.key) && effN(im.f, t.key) && (!R.todo || S.labels.images[im.f]?.r === undefined)) list.push({f:im.f, k:t.key, fr:im.fr});
  R.list = list;
  const j = keepF ? list.findIndex(x => x.f === keepF) : -1;
  R.i = j >= 0 ? j : 0; R.built = true; rotLoad();
}
function rotLoad(){ const it = R.list[R.i]; R.angle = it ? (S.labels.images[it.f]?.r ?? 0) : 0; }
const normA = a => ((Math.round(a*100)/100) % 360 + 360) % 360;
function rotBy(d){ R.angle = normA(R.angle + d); rotPaint(); }
function rotPaint(){
  const im = $('#rimg'); if (im) im.style.transform = `rotate(${R.angle}deg)`;
  const a = $('#rAngle'); if (a) a.textContent = R.angle.toFixed(R.angle % 1 ? 1 : 0) + '°';
  const inp = $('#rAngleIn'); if (inp && document.activeElement !== inp) inp.value = R.angle;
}
function renderRot(){
  const el = $('#rot'); if (!R.built) rotBuild();
  const it = R.list[R.i], n = R.list.length;
  if (!it) { el.innerHTML = `<div class="empty">${R.todo ? 'Every image with a color + number already has a rotation 🎉' : 'No images have both a color and a number yet — tag some in the Tag tab first.'}<br><br>${R.todo ? '<button class="btn" id="rTodoOff">Show all again</button>' : ''}</div>`; $('#rTodoOff')?.addEventListener('click', () => { R.todo = false; rotBuild(); renderRot(); }); return; }
  const done = R.list.filter(x => S.labels.images[x.f]?.r !== undefined).length, saved = S.labels.images[it.f]?.r;
  const c = effC(it.f, it.k), num = effN(it.f, it.k);
  el.innerHTML = `<div class="rotwrap">
    <div><div class="stage" id="stage"><img id="rimg" src="${imgUrl(it.f)}" draggable="false"><div class="g gh"></div><div class="g gv"></div></div>
      <div class="hint" style="margin-top:8px;text-align:center">${R.i+1} / ${n} · ${done} annotated · ${esc(it.k.replace(/^.*\.mp4\./,''))} · frame ${it.fr} · ${pill(c)} ${numBadge(num)} ${saved !== undefined ? `· saved <b>${saved}°</b>` : ''}</div></div>
    <div class="side">
      <div class="angle" id="rAngle">0°</div>
      <div class="two"><button class="btn" data-rot="-1" title="A (Ctrl = 1°)">⟲ Left <span class="kbd">A</span></button><button class="btn" data-rot="1" title="S (Ctrl = 1°)">Right ⟳ <span class="kbd">S</span></button></div>
      <div class="two"><button class="btn" data-fine="-1" title="Z">⟲ 1° <span class="kbd">Z</span></button><button class="btn" data-fine="1" title="X">1° ⟳ <span class="kbd">X</span></button></div>
      <div class="hint">Hold <b>Ctrl</b> while clicking (or pressing A / S) to move just 1°</div>
      <label class="dim">Step <input type="number" id="rStep" min="1" max="180" value="${R.step}"> °</label>
      <label class="dim">Angle <input type="number" id="rAngleIn" step="0.5" value="${R.angle}"> °</label>
      <button class="btn" id="rReset">Reset to 0° <span class="kbd">0</span></button>
      <button class="btn primary" id="rSave">Save &amp; next <span class="kbd">Enter</span></button>
      <div class="two"><button class="btn" id="rPrev">◀ Prev</button><button class="btn" id="rSkip">Skip ▶</button></div>
      <button class="btn ghost" id="rClear" ${saved === undefined ? 'disabled' : ''}>Remove saved rotation <span class="kbd">Del</span></button>
      <label class="dim"><input type="checkbox" id="rTodo" ${R.todo?'checked':''}> only images not annotated yet</label>
      <button class="btn ghost" id="rFirst">Jump to first not annotated</button>
      <div class="hint">Rotate until the number reads upright. Saved as <code>tag_rotation</code> (degrees, clockwise) on export.</div></div></div>`;
  rotPaint();
  el.querySelectorAll('button').forEach(b => b.addEventListener('mousedown', e => e.preventDefault()));   // keep focus off buttons so Enter never double-fires
  el.querySelectorAll('[data-rot]').forEach(b => b.onclick = e => rotBy(+b.dataset.rot * (e.ctrlKey ? 1 : R.step)));
  el.querySelectorAll('[data-fine]').forEach(b => b.onclick = () => rotBy(+b.dataset.fine));
  $('#rStep').oninput = e => { R.step = Math.max(1, +e.target.value || 15); };
  $('#rAngleIn').onchange = e => { R.angle = normA(+e.target.value || 0); rotPaint(); };
  $('#rReset').onclick = () => { R.angle = 0; rotPaint(); };
  $('#rSave').onclick = rotSave;
  $('#rPrev').onclick = () => rotGo(-1); $('#rSkip').onclick = () => rotGo(1);
  $('#rClear').onclick = rotClear;
  $('#rTodo').onchange = e => { R.todo = e.target.checked; rotBuild(it.f); renderRot(); };
  $('#rFirst').onclick = () => { const j = R.list.findIndex(x => S.labels.images[x.f]?.r === undefined); if (j < 0) return toast('All annotated'); R.i = j; rotLoad(); renderRot(); };
  const nx = R.list[R.i+1]; if (nx) new Image().src = imgUrl(nx.f);   // prefetch
}
function rotGo(d){ const j = R.i + d; if (j < 0 || j >= R.list.length) return toast(j < 0 ? 'First image' : 'Last image'); R.i = j; rotLoad(); renderRot(); }
function rotSave(){ const it = R.list[R.i]; if (!it) return; applyLabels({images:{[it.f]:{r:R.angle}}}); renderStats(); if (R.i < R.list.length-1) rotGo(1); else { renderRot(); toast('Saved — that was the last image'); } }
function rotClear(){ const it = R.list[R.i]; if (!it || S.labels.images[it.f]?.r === undefined) return; applyLabels({images:{[it.f]:{r:null}}}); R.angle = 0; renderRot(); }
function rotKey(e){
  if (e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase(), fine = e.ctrlKey;
  if (k === 'a') { e.preventDefault(); rotBy(-(fine ? 1 : R.step)); }
  else if (k === 's') { e.preventDefault(); rotBy(fine ? 1 : R.step); }
  else if (e.ctrlKey) return;
  else if (k === 'z') rotBy(-1);
  else if (k === 'x') rotBy(1);
  else if (e.key === 'Enter') { e.preventDefault(); rotSave(); }
  else if (e.key === '0') { R.angle = 0; rotPaint(); }
  else if (e.key === 'ArrowLeft') rotGo(-1);
  else if (e.key === 'ArrowRight') rotGo(1);
  else if (e.key === 'Delete') rotClear();
}

/* ---------- menus ---------- */
function closeMenu(){ document.querySelectorAll('.menu').forEach(m => m.remove()); }
document.addEventListener('mousedown', e => { if (!e.target.closest('.menu') && !e.target.closest('[data-numgrid]')) closeMenu(); });
window.addEventListener('scroll', closeMenu, {passive:true});
function placeMenu(m, x, y){
  document.body.appendChild(m);
  const r = m.getBoundingClientRect();
  m.style.left = Math.max(4, Math.min(x, innerWidth - r.width - 8)) + 'px';
  m.style.top = Math.max(4, Math.min(y, innerHeight - r.height - 8)) + 'px';
}
function showMenu(x, y, head, items){
  closeMenu();
  const m = document.createElement('div'); m.className = 'menu';
  m.innerHTML = `<div class="h">${esc(head)}</div>`;
  items.filter(i => !i.skip).forEach(i => {
    if (i === 'hr') return m.appendChild(document.createElement('hr'));
    const d = document.createElement('div'); d.className = 'it' + (i.danger?' danger':'');
    d.style.setProperty('--c', i.color || 'transparent');
    d.innerHTML = (i.color ? '<span class="dot"></span>' : '') + esc(i.label);
    d.onclick = () => { closeMenu(); i.fn(); };
    m.appendChild(d);
  });
  placeMenu(m, x, y); return m;
}
function numGrid(btn){
  closeMenu();
  const cur = S.view === 'track' ? null : (S.sel.size === 1 ? trackL([...S.sel][0]).n : null);
  const m = document.createElement('div'); m.className = 'menu';
  m.innerHTML = `<div class="h">Set number${S.view==='track' ? ' for whole track' : ''}</div><div class="ngrid">` +
    Array.from({length:NUMMAX}, (_,i) => `<button class="${cur===i+1?'cur':''}" data-n="${i+1}">${i+1}</button>`).join('') + '</div>';
  m.onclick = e => { const b = e.target.closest('button'); if (b) { closeMenu(); setNumber(b.dataset.n); } };
  const r = btn.getBoundingClientRect(); placeMenu(m, r.left, r.bottom + 6);
}
async function saveTags(){ await api('/api/tags', {tags:S.tags}); render(); }
function editTagMenu(x, y, t){
  closeMenu();
  const m = document.createElement('div'); m.className = 'menu';
  const i = S.tags.indexOf(t);
  m.innerHTML = `<div class="h">Edit tag</div><label>Name <input type="text" id="tn" value="${esc(t.name)}"></label><label>Color <input type="color" id="tc" value="${t.color}"></label><label>Hotkey <input type="text" id="tk" readonly style="width:64px;text-align:center;cursor:pointer" placeholder="none" title="Click, then press a key. Backspace/Delete clears."></label>`;
  const add = (label, fn, danger) => { const d = document.createElement('div'); d.className = 'it' + (danger?' danger':''); d.textContent = label; d.onclick = () => { closeMenu(); fn(); }; m.appendChild(d); };
  m.appendChild(document.createElement('hr'));
  if (i > 0) add('← Move left (changes hotkey)', () => { S.tags.splice(i,1); S.tags.splice(i-1,0,t); saveTags(); });
  if (i < S.tags.length-1) add('Move right → (changes hotkey)', () => { S.tags.splice(i,1); S.tags.splice(i+1,0,t); saveTags(); });
  add('Delete tag…', async () => {
    const cnt = Object.values(S.labels.tracks).filter(v=>v.c===t.id).length + Object.values(S.labels.images).filter(v=>v.c===t.id).length;
    if (!confirm(`Delete "${t.name}"?` + (cnt ? ` ${cnt} color labels using it will be cleared (numbers are kept).` : ''))) return;
    S.tags.splice(i,1);
    await api('/api/purge_tag', {id:t.id});
    for (const kind of ['tracks','images']) for (const [k,v] of Object.entries(S.labels[kind])) if (v.c === t.id) { delete v.c; if (!Object.keys(v).length) delete S.labels[kind][k]; }
    if (S.fc === t.id) S.fc = 'all';
    saveTags();
  }, true);
  placeMenu(m, x, y);
  const nm = m.querySelector('#tn'), cl = m.querySelector('#tc');
  nm.onchange = () => { t.name = nm.value.trim() || t.name; saveTags(); };
  nm.onkeydown = e => { e.stopPropagation(); if (e.key === 'Enter') { nm.onchange(); closeMenu(); } };
  cl.oninput = () => { t.color = cl.value; renderPalette(); };
  cl.onchange = () => saveTags();
  const tk = m.querySelector('#tk'); tk.value = (tagKeys()[t.id] || '').toUpperCase();
  tk.onkeydown = e => {
    e.stopPropagation(); e.preventDefault();
    if (e.key === 'Tab' || e.key === 'Escape') return closeMenu();
    let k;
    if (e.key === 'Backspace' || e.key === 'Delete') k = '';
    else if (e.key.length !== 1 || /[0-9\s]/.test(e.key) || e.ctrlKey || e.metaKey || e.altKey) return toast('Use a single letter/symbol key (digits are for numbers)');
    else k = e.key.toLowerCase();
    if (k) { const o = S.tags.find(x => x !== t && tagKeys()[x.id] === k); if (o) o.key = ''; }
    t.key = k; closeMenu(); saveTags();
  };
  nm.focus(); nm.select();
}
function addTag(){
  const name = prompt('New color tag name:'); if (!name) return;
  const c = document.createElement('canvas').getContext('2d'); c.fillStyle = `hsl(${Math.floor(Math.random()*360)} 70% 55%)`;
  const hex = '#' + [1,3,5].map(i => c.fillStyle.slice(i,i+2)).join('');
  S.tags.push({id:'t'+Date.now().toString(36), name:name.trim(), color:hex}); saveTags();
}
boot();
</script>
